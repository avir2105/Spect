[metadata]
name = spect
version = 0.1.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    torch>=2.1.0
    transformers>=4.45.0
    accelerate>=0.33.0
    safetensors>=0.4.0
    sentencepiece>=0.2.0
    protobuf>=4.25.0
    PyYAML>=6.0
    tqdm>=4.66.0
    numpy>=1.24.0
    psutil>=5.9.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    spect = spect.cli:main