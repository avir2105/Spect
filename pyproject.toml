[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spect"
version = "0.1.0"
description = "Speculative / assisted decoding benchmarks with metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.45.0",
  "accelerate>=0.33.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
  "numpy>=1.24.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43.0"]

[project.scripts]
spect = "spect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]