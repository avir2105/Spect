# Week 1 default: same-family Qwen draft + 3B 4-bit target (comfortable on ~15GB T4)
name: week1_qwen
draft_model: Qwen/Qwen2.5-0.5B-Instruct
target_model: Qwen/Qwen2.5-3B-Instruct
load_in_4bit: true
torch_dtype: float16
max_new_tokens: 128
# Number of candidate tokens the draft proposes per verification step (HF assisted gen)
assistant_num_candidate_tokens: 5
temperature: 0.0
do_sample: false
prompts_path: data/prompts.json
output_dir: results
seed: 42

# Optional larger target if you have headroom
fallback_target_model: Qwen/Qwen2.5-7B-Instruct
